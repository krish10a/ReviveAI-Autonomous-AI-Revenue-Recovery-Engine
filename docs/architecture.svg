<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Card & Theme Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131d31" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers with explicit fills -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">REVIVEAI — AUTONOMOUS REVENUE RECOVERY ENGINE</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">CLOSED-LOOP FINTECH RECOVERY &amp; SAFETY ARCHITECTURE</text>

  <!-- Key Principle Banner -->
  <rect x="330" y="74" width="540" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
    CORE PRINCIPLE: AI proposes. Policy decides. Executor acts. Verification proves.
  </text>

  <!-- Main Pipeline Box -->
  <rect x="35" y="112" width="1130" height="495" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="1.5" />
  <text x="60" y="138" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CLOSED-LOOP OPERATIONAL WORKFLOW</text>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="145" height="105" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="155" width="145" height="4" rx="2" fill="url(#blueGrad)" />
    <text x="127" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">1. Payment Failure</text>
    <text x="127" y="203" text-anchor="middle" font-size="10.5" fill="#94a3b8">Webhook Ingestion</text>
    <text x="127" y="219" text-anchor="middle" font-size="10" fill="#64748b">HMAC Signature Check</text>
    <text x="127" y="235" text-anchor="middle" font-size="10" fill="#38bdf8">Idempotency Guard</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 207 L 235 207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 2: DIAGNOSIS ==================== -->
  <g filter="url(#shadow)">
    <rect x="235" y="155" width="145" height="105" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="235" y="155" width="145" height="4" rx="2" fill="url(#blueGrad)" />
    <text x="307" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">2. Failure Diagnosis</text>
    <text x="307" y="203" text-anchor="middle" font-size="10.5" fill="#94a3b8">Root Cause Taxonomy</text>
    <text x="307" y="219" text-anchor="middle" font-size="10" fill="#64748b">Gateway Code Parser</text>
    <text x="307" y="235" text-anchor="middle" font-size="10" fill="#38bdf8">Transient vs Hard Fault</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 380 207 L 415 207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 3: ML PREDICTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="415" y="155" width="150" height="105" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="415" y="155" width="150" height="4" rx="2" fill="url(#purpleGrad)" />
    <text x="490" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">3. ML Predictor</text>
    <text x="490" y="203" text-anchor="middle" font-size="10.5" fill="#c084fc">Action-Conditioned</text>
    <text x="490" y="219" text-anchor="middle" font-size="10" fill="#94a3b8">P(recovery | action)</text>
    <text x="490" y="235" text-anchor="middle" font-size="10" fill="#a855f7">Expected Value Calc</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 565 207 L 600 207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 4: AGENT PROPOSAL ==================== -->
  <g filter="url(#shadow)">
    <rect x="600" y="155" width="145" height="105" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="600" y="155" width="145" height="4" rx="2" fill="url(#purpleGrad)" />
    <text x="672" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">4. AI Proposal</text>
    <text x="672" y="203" text-anchor="middle" font-size="10.5" fill="#94a3b8">Action Recommendation</text>
    <text x="672" y="219" text-anchor="middle" font-size="9.5" font-weight="700" fill="#f43f5e">PROPOSED ONLY</text>
    <text x="672" y="235" text-anchor="middle" font-size="10" fill="#fbbf24">Zero Direct Execution</text>
  </g>

  <!-- Arrow 4 -> 5 (Policy Engine) -->
  <path d="M 745 207 L 780 207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 5: POLICY ENGINE ==================== -->
  <g filter="url(#shadow)">
    <rect x="780" y="145" width="365" height="230" rx="12" fill="#151d30" stroke="#f59e0b" stroke-width="2" />
    <rect x="780" y="145" width="365" height="5" rx="2.5" fill="url(#amberGrad)" />
    <text x="962" y="172" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fbbf24" letter-spacing="0.5">5. DETERMINISTIC POLICY ENGINE</text>
    <text x="962" y="189" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fde68a">HARD SAFETY BARRIER (AI Cannot Bypass)</text>

    <!-- Guardrails Sub-container -->
    <rect x="795" y="200" width="335" height="135" rx="8" fill="#0d1527" stroke="#334155" stroke-width="1" />
    <text x="805" y="218" font-size="10" font-weight="700" fill="#f1f5f9">1. Customer Opt-Out: <tspan font-weight="400" fill="#f87171">100% Zero-Contact Block</tspan></text>
    <text x="805" y="234" font-size="10" font-weight="700" fill="#f1f5f9">2. Bank Outage Detect: <tspan font-weight="400" fill="#fbbf24">Forced WAIT (rolling &gt;30%)</tspan></text>
    <text x="805" y="250" font-size="10" font-weight="700" fill="#f1f5f9">3. Amount Ceiling: <tspan font-weight="400" fill="#f43f5e">ESCALATE if &gt;&#x20B9;10,000</tspan></text>
    <text x="805" y="266" font-size="10" font-weight="700" fill="#f1f5f9">4. Night Quiet Hours: <tspan font-weight="400" fill="#94a3b8">Suppress 21:00-08:00</tspan></text>
    <text x="805" y="282" font-size="10" font-weight="700" fill="#f1f5f9">5. Retry Limits: <tspan font-weight="400" fill="#94a3b8">Max 3 attempts per case</tspan></text>
    <text x="805" y="298" font-size="10" font-weight="700" fill="#f1f5f9">6. Cooldown Window: <tspan font-weight="400" fill="#94a3b8">2-hour spacing between contact</tspan></text>
    <text x="805" y="314" font-size="10" font-weight="700" fill="#f1f5f9">7. Already Captured: <tspan font-weight="400" fill="#34d399">Instant STOP (Anti-Double Charge)</tspan></text>
    <text x="805" y="328" font-size="10" font-weight="700" fill="#f1f5f9">8. Case Expiry: <tspan font-weight="400" fill="#64748b">Close after 48h horizon</tspan></text>

    <text x="962" y="362" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">Decision Authority: ALLOWED or Protective Action</text>
  </g>

  <!-- ==================== POLICY BRANCHES (WITH EXPLICIT fill="none") ==================== -->
  <!-- Branch 1: ALLOWED -> Executor -->
  <path d="M 962 375 L 962 425 L 755 425" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)" />
  <rect x="830" y="413" width="85" height="22" rx="4" fill="#047857" />
  <text x="872" y="428" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ecfdf5">ALLOWED</text>

  <!-- Branch 2: STOP -->
  <path d="M 780 260 L 720 260 L 720 315" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)" />
  <rect x="675" y="315" width="90" height="40" rx="6" fill="#1e1520" stroke="#f43f5e" stroke-width="1.5" />
  <text x="720" y="333" text-anchor="middle" font-size="11" font-weight="800" fill="#f87171">STOP</text>
  <text x="720" y="347" text-anchor="middle" font-size="9" fill="#fda4af">Suppress Action</text>

  <!-- Branch 3: WAIT -->
  <path d="M 780 320 L 760 320 L 760 375" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="715" y="375" width="90" height="40" rx="6" fill="#201a14" stroke="#f59e0b" stroke-width="1.5" />
  <text x="760" y="393" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">WAIT</text>
  <text x="760" y="407" text-anchor="middle" font-size="9" fill="#fde68a">Backoff Until Health</text>

  <!-- Branch 4: ESCALATE (routes cleanly downward to Human Ops) -->
  <path d="M 1145 260 L 1155 260 L 1155 510 L 800 510 L 800 645" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowPurple)" />
  <rect x="1085" y="275" width="75" height="20" rx="4" fill="#581c87" />
  <text x="1122" y="289" text-anchor="middle" font-size="9" font-weight="800" fill="#f5d0fe">ESCALATE</text>

  <!-- ==================== STAGE 6: BOUNDED EXECUTOR ==================== -->
  <g filter="url(#shadow)">
    <rect x="585" y="390" width="170" height="105" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="585" y="390" width="170" height="4" rx="2" fill="url(#blueGrad)" />
    <text x="670" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">6. Bounded Executor</text>
    <text x="670" y="438" text-anchor="middle" font-size="10.5" fill="#94a3b8">Action Primitives</text>
    <text x="670" y="454" text-anchor="middle" font-size="10" fill="#64748b">Retry / Payment Link</text>
    <text x="670" y="470" text-anchor="middle" font-size="10" fill="#38bdf8">Mode: Bounded Gateway</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 585 442 L 535 442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 7: INDEPENDENT VERIFICATION ==================== -->
  <g filter="url(#shadow)">
    <rect x="345" y="390" width="190" height="105" rx="10" fill="url(#cardGrad)" stroke="#047857" stroke-width="1.5" />
    <rect x="345" y="390" width="190" height="4" rx="2" fill="url(#emeraldGrad)" />
    <text x="440" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34d399">7. Verification</text>
    <text x="440" y="438" text-anchor="middle" font-size="10.5" fill="#a7f3d0">Independent Proof Source</text>
    <text x="440" y="454" text-anchor="middle" font-size="10" fill="#94a3b8">Non-Self-Reported State</text>
    <text x="440" y="470" text-anchor="middle" font-size="10" fill="#6ee7b7">Dual-Key Validation</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 345 442 L 285 442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- ==================== STAGE 8: FINANCIAL LEDGER ==================== -->
  <g filter="url(#shadow)">
    <rect x="85" y="390" width="200" height="105" rx="10" fill="url(#cardGrad)" stroke="#047857" stroke-width="2" />
    <rect x="85" y="390" width="200" height="4" rx="2" fill="url(#emeraldGrad)" />
    <text x="185" y="418" text-anchor="middle" font-size="12.5" font-weight="800" fill="#34d399">8. Financial Ledger</text>
    <text x="185" y="438" text-anchor="middle" font-size="10.5" fill="#ecfdf5">Double-Entry Accounting</text>
    <text x="185" y="454" text-anchor="middle" font-size="10" fill="#94a3b8">Net = Gross &#x2212; Action Cost</text>
    <text x="185" y="470" text-anchor="middle" font-size="10" fill="#6ee7b7">Immutable Audit Record</text>
  </g>

  <!-- ==================== SUPPORTING INFRASTRUCTURE ==================== -->
  <rect x="35" y="625" width="1130" height="150" rx="16" fill="#080e1a" stroke="#1e293b" stroke-width="1.5" />
  <text x="60" y="650" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">PERSISTENCE, GOVERNANCE &amp; REPORTING LAYER</text>

  <!-- PostgreSQL Box -->
  <g filter="url(#shadow)">
    <rect x="55" y="662" width="240" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="662" width="240" height="4" rx="2" fill="url(#blueGrad)" />
    <text x="175" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">PostgreSQL Relational DB</text>
    <text x="175" y="706" text-anchor="middle" font-size="10.5" fill="#94a3b8">System of Record</text>
    <text x="175" y="724" text-anchor="middle" font-size="9.5" fill="#64748b">ACID Transactions &#x2022; Strict FKs</text>
    <text x="175" y="740" text-anchor="middle" font-size="9.5" fill="#38bdf8">Idempotency &amp; Unique Constraints</text>
  </g>

  <!-- Audit Log Box -->
  <g filter="url(#shadow)">
    <rect x="330" y="662" width="260" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="330" y="662" width="260" height="4" rx="2" fill="url(#amberGrad)" />
    <text x="460" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Audit Trail &amp; Timeline</text>
    <text x="460" y="706" text-anchor="middle" font-size="10.5" fill="#fbbf24">Chronological Event Stream</text>
    <text x="460" y="724" text-anchor="middle" font-size="9.5" fill="#94a3b8">actor, action, inputs, decision_data</text>
    <text x="460" y="740" text-anchor="middle" font-size="9.5" fill="#fde68a">Every Decision 100% Replayable</text>
  </g>

  <!-- Human Ops Box -->
  <g filter="url(#shadow)">
    <rect x="625" y="662" width="265" height="95" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="625" y="662" width="265" height="4" rx="2" fill="url(#purpleGrad)" />
    <text x="757" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Human Ops &amp; Escalation</text>
    <text x="757" y="706" text-anchor="middle" font-size="10.5" fill="#c084fc">Exception Handling Desk</text>
    <text x="757" y="724" text-anchor="middle" font-size="9.5" fill="#94a3b8">High-Value (&gt;&#x20B9;10K) &#x2022; Risk Review</text>
    <text x="757" y="740" text-anchor="middle" font-size="9.5" fill="#e9d5ff">Supervisor Disposition Workflow</text>
  </g>

  <!-- Realtime Analytics Box -->
  <g filter="url(#shadow)">
    <rect x="925" y="662" width="220" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="925" y="662" width="220" height="4" rx="2" fill="url(#emeraldGrad)" />
    <text x="1035" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Analytics &amp; Experiment</text>
    <text x="1035" y="706" text-anchor="middle" font-size="10.5" fill="#34d399">Deterministic Reconciliation</text>
    <text x="1035" y="724" text-anchor="middle" font-size="9.5" fill="#94a3b8">Monotonic Funnel Metrics</text>
    <text x="1035" y="740" text-anchor="middle" font-size="9.5" fill="#a7f3d0">50 vs 50 A/B Trial (+42 pp Lift)</text>
  </g>

  <!-- Vertical connectors from DB / Audit to pipeline -->
  <path d="M 175 625 L 175 495" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 460 625 L 460 495" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 1035 625 L 1035 375" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Footnote -->
  <text x="600" y="800" text-anchor="middle" font-size="10" fill="#64748b">
    ReviveAI Closed-Loop Architecture &#x2022; Synthetic Demonstration Environment &#x2022; No Real Customer Funds Processed
  </text>
</svg>
